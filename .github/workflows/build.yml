name: Build check

# Sanity-builds each character mod project on every push/PR.
# Add a new job block when a second character is added under characters/.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shorekeeper:
    runs-on: windows-latest  # Godot .NET mod builds are most reliably tested on Windows runners
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore characters/Shorekeeper/Shorekeeper.csproj

      - name: Build
        run: dotnet build characters/Shorekeeper/Shorekeeper.csproj --configuration Release --no-restore
